<label for="question">Question:</label>
<textarea id="question" name="question"></textarea>

<label for="domain">Only use this domain:</label>
<input type="text" id="domain" name="domain">

<label for="after-date">Published after:</label>
<input type="date" id="after-date" name="after-date">

<label for="before-date">Published before:</label>
<input type="date" id="before-date" name="before-date">

<label for="recency">Recency:</label>
<select id="recency" name="recency">
	<option value="">No limit</option>
	<option value="day">Past day</option>
	<option value="week">Past week</option>
	<option value="month">Past month</option>
	<option value="year">Past year</option>
</select>
