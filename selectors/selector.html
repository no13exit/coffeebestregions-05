<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="styles.css">
	<title>selector</title>
</head>
<body>
<h1>Цвета радуги</h1>

<p class="mnemonicru" lang="ru">
	Каждый Охотник Желает Знать, Где Сидит Фазан
</p>

<p class="mnemoniceng" lang="en">
	Richard Of York Gave Battle In Vain
</p>

<div class="rainbow">
	<div class="rainbow">
		<div class="stripe red">
			<span class="left">Каждый</span>
			<span class="center">Красный / Red</span>
			<span class="right">Richard</span>
		</div>

		<div class="stripe orange">
			<span class="left">Охотник</span>
			<span class="center">Оранжевый / Orange</span>
			<span class="right">Of</span>
		</div>

		<div class="stripe yellow">
			<span class="left">Желает</span>
			<span class="center">Жёлтый / Yellow</span>
			<span class="right">York</span>
		</div>

		<div class="stripe green">
			<span class="left">Знать</span>
			<span class="center">Зелёный / Green</span>
			<span class="right">Gave</span>
		</div>

		<div class="stripe light-blue">
			<span class="left">Где</span>
			<span class="center">Голубой / Blue</span>
			<span class="right">Battle</span>
		</div>

		<div class="stripe blue">
			<span class="left">Сидит</span>
			<span class="center">Синий / Indigo</span>
			<span class="right">In</span>
		</div>

		<div class="stripe violet">
			<span class="left">Фазан</span>
			<span class="center">Фиолетовый / Violet</span>
			<span class="right">Vain</span>
		</div>
	</div>
</div>
</body>
</html>
